<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АкваВнуково — v2</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app" class="shell">
    <section id="setup" class="panel hidden">
      <h1>Первый запуск</h1>
      <p class="muted">Введите URL проекта Supabase и publishable/anon key. Эти данные можно сохранить только в этом браузере.</p>
      <label>Supabase URL<input id="supabase-url" type="url" placeholder="https://....supabase.co"></label>
      <label>Publishable / anon key<input id="supabase-key" type="password"></label>
      <button id="save-config">Сохранить и продолжить</button>
    </section>

    <section id="auth" class="panel hidden">
      <h1>АкваВнуково</h1>
      <p class="muted">Тестовая версия нового приложения</p>
      <form id="login-form">
        <label>Email<input id="email" type="email" required></label>
        <label>Пароль<input id="password" type="password" required></label>
        <button>Войти</button>
      </form>
      <p id="auth-error" class="error"></p>
    </section>

    <section id="workspace" class="hidden">
      <header class="topbar">
        <div><strong>АкваВнуково</strong><span id="user-email" class="muted"></span></div>
        <button id="logout" class="secondary">Выйти</button>
      </header>
      <nav class="tabs">
        <button class="tab active" data-screen="schedule">Расписание</button>
        <button class="tab" data-screen="clients">Клиенты</button>
      </nav>
      <section id="schedule" class="screen">
        <div class="toolbar"><h2>Расписание</h2><input id="schedule-date" type="date"><select id="instructor-select"></select></div>
        <div id="schedule-list" class="cards"></div>
      </section>
      <section id="clients" class="screen hidden">
        <div class="toolbar"><h2>Клиенты</h2><input id="client-search" placeholder="Имя или телефон"></div>
        <div id="clients-list" class="cards"></div>
      </section>
      <p id="data-error" class="error"></p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
